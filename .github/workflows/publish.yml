name: Publish to npm
run-name: SiteView SDK ${{ inputs.version }}${{ inputs.dry_run && ' (dry run)' || '' }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Exact version already set in package.json (e.g. 0.1.7)'
        required: true
        type: string
      dry_run:
        description: 'Build and inspect the package without publishing'
        type: boolean
        default: true

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tarball: ${{ steps.pack.outputs.tarball }}
      integrity: ${{ steps.pack.outputs.integrity }}

    steps:
      - name: Verify release ref
        if: ${{ !inputs.dry_run && github.ref != 'refs/heads/main' }}
        run: exit 1

      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Check release version
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          node <<'NODE'
          const version = process.env.RELEASE_VERSION;
          if (!/^\d+\.\d+\.\d+$/.test(version) ||
              require('./package.json').version !== version ||
              require('./package-lock.json').packages[''].version !== version) {
            throw new Error('Release version must match package.json and package-lock.json');
          }
          NODE

      - name: Install, test and build
        run: |
          npm ci
          npm test
          npm run build

      - name: Pack and validate
        id: pack
        run: |
          npm pack --json > "$RUNNER_TEMP/sdk-pack.json"
          node - "$RUNNER_TEMP/sdk-pack.json" >> "$GITHUB_OUTPUT" <<'NODE'
          const { main, module: esm, types } = require('./package.json');
          const [{ filename, files, integrity }] = require(process.argv[2]);
          for (const entry of [main, esm, types]) {
            if (!files.some(({ path }) => path === entry.replace(/^\.\//, ''))) {
              throw new Error(`Missing package entry: ${entry}`);
            }
          }
          console.log(`tarball=${filename}\nintegrity=${integrity}`);
          NODE

      - name: Upload validated package
        uses: actions/upload-artifact@v6
        with:
          name: sdk-package
          path: ${{ steps.pack.outputs.tarball }}
          if-no-files-found: error
          retention-days: 1

  publish:
    if: ${{ !inputs.dry_run }}
    needs: build
    runs-on: ubuntu-latest
    environment: npm-release
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Download validated package
        uses: actions/download-artifact@v7
        with:
          name: sdk-package

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/
          package-manager-cache: false

      - name: Publish to npm via OIDC
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          TARBALL: ${{ needs.build.outputs.tarball }}
          INTEGRITY: ${{ needs.build.outputs.integrity }}
        run: |
          actual_integrity="sha512-$(openssl dgst -sha512 -binary "$TARBALL" | openssl base64 -A)"
          if [ "$actual_integrity" != "$INTEGRITY" ]; then
            echo 'Downloaded tarball integrity does not match the validated package.' >&2
            exit 1
          fi

          published_integrity=$(npm view "@cupix-sdk/siteview-sdk@$RELEASE_VERSION" dist.integrity 2>/dev/null || true)
          if [ "$published_integrity" = "$INTEGRITY" ]; then
            echo 'This tarball has already been published.'
          elif [ -n "$published_integrity" ]; then
            echo 'This version already exists with different contents.' >&2
            exit 1
          else
            npm publish "./$TARBALL" --access public
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: siteview-sdk-v${{ inputs.version }}
          name: v${{ inputs.version }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
